name: CD - Deploy Staging

on:
  workflow_call:
    secrets:
      AZURE_STAGING_PUBLISH_PROFILE:
        required: true

jobs:
  deploy-staging:
    name: Deploy to Azure staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Deploy image that passed CI
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: sellora-delivery
          publish-profile: ${{ secrets.AZURE_STAGING_PUBLISH_PROFILE }}
          images: index.docker.io/naveentharuka/sellora-delivery:dev-${{ github.sha }}

      - name: Validate staging startup
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..20}; do
            RESPONSE=$(curl \
              --silent \
              --show-error \
              --max-time 10 \
              "https://sellora-delivery-ezfshqckchege7gb.eastasia-01.azurewebsites.net/health" || true)

            if jq -e --arg sha "${{ github.sha }}" '.status == "healthy" and .revision == $sha' <<< "$RESPONSE" >/dev/null 2>&1; then
              echo "Staging startup validation passed for commit ${{ github.sha }}"
              exit 0
            fi

            echo "Attempt $attempt -> expected commit ${{ github.sha }}, response: ${RESPONSE:-unavailable}"
            sleep 15
          done

          echo "Staging deployment failed health validation."
          exit 1
