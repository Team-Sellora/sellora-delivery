name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      solution-path: Sellora.DeliveryService.sln
      sonar-project-key: Team-Sellora_sellora-delivery
      sonar-organization: team-sellora
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish-image:
    name: Publish delivery image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./Dockerfile
          build-args: BUILD_COMMIT_SHA=${{ github.sha }}
          push: true
          tags: naveentharuka/sellora-delivery:dev-${{ github.sha }}

  deploy-staging:
    name: Deploy delivery to Azure staging
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/cd-staging.yml
    secrets:
      AZURE_STAGING_PUBLISH_PROFILE: ${{ secrets.AZURE_STAGING_PUBLISH_PROFILE }}
